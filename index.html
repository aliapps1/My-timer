<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Timer Pro</title>
    <style>
        :root { 
            /* رنگ‌های روشن و انرژی‌بخش */
            --bg: #f0f4f8; 
            --card: rgba(255, 255, 255, 0.9); 
            --text: #1e293b; 
            --primary: #3b82f6; 
            --accent: #f59e0b; 
            --danger: #ef4444;
        }
        
        body { 
            background: var(--bg) !important;
            background-image: radial-gradient(circle at top right, #dbeafe 0%, #f0f4f8 100%) !important;
            color: var(--text); 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            display: flex; align-items: center; justify-content: center; 
            min-height: 100vh; margin: 0; padding: 20px; transition: 0.5s; 
        }

        .card { 
            background: var(--card); 
            backdrop-filter: blur(20px);
            padding: 2.5rem; border-radius: 2.5rem; 
            width: 100%; max-width: 400px; text-align: center; 
            border: 1px solid rgba(255,255,255,0.8); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.05); 
        }

        .nav-btn { 
            padding: 8px 15px; background: #fff; 
            color: var(--text); border: 1px solid #e2e8f0; 
            border-radius: 10px; cursor: pointer; font-size: 12px; font-weight: bold; margin: 0 2px;
        }

        .time { 
            font-size: 6rem; font-weight: 800; margin: 15px 0; 
            color: var(--primary); letter-spacing: -2px;
        }

        .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 20px 0; }
        .modes button { 
            background: #f8fafc; padding: 10px; 
            color: #64748b; border-radius: 12px; border: 1px solid #e2e8f0; 
            cursor: pointer; transition: 0.2s; font-weight: 600;
        }
        .modes button.active { background: var(--primary); color: white; border: none; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); }

        .controls { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; margin: 20px 0; }
        .btn-main { padding: 16px; border-radius: 18px; border: none; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 1rem; }
        .btn-start { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.2); }
        .btn-pause { background: #e2e8f0; color: #475569; }
        .btn-reset { background: var(--danger); color: white; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.2); }

        .stats-card { 
            background: #f8fafc; border-radius: 20px; 
            padding: 15px; margin-top: 20px; border: 1px solid #e2e8f0;
        }
        .stat-item { display: flex; justify-content: space-between; margin-bottom: 5px; font-weight: 600; color: #475569; }
        
        .sound-select { 
            width: 100%; padding: 12px; border-radius: 12px; 
            background: #f8fafc; border: 1px solid #e2e8f0; margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="card" id="mainCard">
        <div style="margin-bottom: 20px;">
            <button class="nav-btn" onclick="changeLang('en')">EN</button>
            <button class="nav-btn" onclick="changeLang('ar')">AR</button>
            <button class="nav-btn" onclick="changeLang('fa')">FA</button>
        </div>
        
        <h2 id="lbl-title" style="margin: 0; font-size: 1.5rem;">Focus Timer</h2>

        <div class="modes">
            <button class="active" onclick="setTime(1500, this)">25m</button>
            <button onclick="setTime(3000, this)">50m</button>
            <button onclick="setTime(600, this)">10m</button>
        </div>

        <div class="time" id="display">25:00</div>

        <div class="controls">
            <button class="btn-main btn-start" id="btn-start" onclick="startTimer()">Start</button>
            <button class="btn-main btn-pause" id="btn-pause" onclick="pauseTimer()">Pause</button>
            <button class="btn-main btn-reset" id="btn-reset" onclick="resetTimer()">Reset</button>
        </div>

        <div class="stats-card">
            <div class="stat-item"><span id="lbl-today">Today:</span> <span id="stat-today">0 min</span></div>
            <div class="stat-item"><span id="lbl-streak">Streak:</span> <span id="stat-streak">0 days</span></div>
        </div>
    </div>

    <script>
        let timeLeft = 1500, timerId = null, currentLang = 'en';
        const translations = {
            en: { title: "Focus Timer", start: "Start", pause: "Pause", reset: "Reset", today: "Today:", streak: "Streak:", min: "min", day: "days", dir: "ltr" },
            fa: { title: "تایمر تمرکز", start: "شروع", pause: "توقف", reset: "شروع مجدد", today: "امروز:", streak: "زنجیره:", min: "دقیقه", day: "روز", dir: "rtl" },
            ar: { title: "مؤقت التركيز", start: "بدء", pause: "إيقاف", reset: "إعادة", today: "اليوم:", streak: "متسلسل:", min: "دقیقة", day: "یوم", dir: "rtl" }
        };

        function updateUI() {
            const t = translations[currentLang];
            document.body.dir = t.dir;
            document.getElementById('lbl-title').innerText = t.title;
            document.getElementById('btn-start').innerText = t.start;
            document.getElementById('btn-pause').innerText = t.pause;
            document.getElementById('btn-reset').innerText = t.reset;
            document.getElementById('lbl-today').innerText = t.today;
            document.getElementById('lbl-streak').innerText = t.streak;
            document.getElementById('mainCard').style.textAlign = t.dir === 'rtl' ? 'right' : 'center';
        }

        function setTime(s, btn) {
            timeLeft = s; 
            document.querySelectorAll('.modes button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            updateDisplay();
        }

        function updateDisplay() {
            const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
            document.getElementById('display').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function startTimer() { if (!timerId) timerId = setInterval(() => { if(timeLeft > 0) { timeLeft--; updateDisplay(); } }, 1000); }
        function pauseTimer() { clearInterval(timerId); timerId = null; }
        function resetTimer() { pauseTimer(); updateDisplay(); }
        function changeLang(l) { currentLang = l; updateUI(); }

        updateUI();
    </script>
</body>
</html>
