<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Timer</title>
    <link rel="icon" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --primary: #22d3ee; }
        .light { --bg: #f0f2f5; --card: #ffffff; --text: #1c1e21; --primary: #0891b2; }
        body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; transition: 0.5s; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: var(--card); padding: 1.5rem; border-radius: 2rem; box-shadow: 0 20px 50px rgba(0,0,0,0.2); width: 100%; max-width: 340px; border: 1px solid #334155; position: relative; text-align: right; }
        .ltr-mode { text-align: left !important; }
        .date-display { font-size: 0.85rem; color: var(--primary); margin-bottom: 2px; opacity: 0.9; }
        .clock-display { font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; color: var(--text); opacity: 0.8; }
        .time { font-size: 4.5rem; font-weight: 800; margin: 0.5rem 0; color: var(--primary); font-family: monospace; text-align: center; }
        .modes { display: flex; justify-content: space-between; margin: 15px 0; gap: 5px; }
        .modes button { background: #334155; font-size: 0.7rem; padding: 10px 5px; color: white; border: none; border-radius: 10px; flex: 1; cursor: pointer; }
        .modes button.active { background: var(--primary); color: #0f172a; font-weight: bold; }
        .main-btn { width: 100%; padding: 1rem; border: none; border-radius: 15px; cursor: pointer; font-weight: bold; background: var(--primary); color: #0f172a; font-size: 1.2rem; }
        .reset-btn { background: none; border: none; color: #64748b; cursor: pointer; margin-top: 10px; font-size: 0.9rem; text-decoration: underline; width: 100%; text-align: center; }
        .lang-btns { position: absolute; top: -50px; left: 0; display: flex; gap: 5px; }
        .lang-btns button { font-size: 11px; padding: 6px 10px; background: #334155; color: white; border: none; border-radius: 8px; cursor: pointer; }
        .top-controls { position: absolute; top: -50px; right: 0; display: flex; gap: 10px; align-items: center; }
        .icon-btn { font-size: 22px; cursor: pointer; background: none; border: none; padding: 0; }
        hr { border: 0; border-top: 1px solid #334155; margin: 15px 0; }
        .task-input-group { display: flex; gap: 5px; margin-top: 10px; }
        input { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: white; }
        .add-btn { background: var(--primary); border: none; padding: 10px 15px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        ul { list-style: none; padding: 0; margin-top: 15px; }
        li { background: #334155; margin-bottom: 5px; padding: 8px 12px; border-radius: 8px; font-size: 0.9rem; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <div class="card" id="mainCard">
        <div class="lang-btns">
            <button onclick="changeLang('fa')">FA</button>
            <button onclick="changeLang('en')">EN</button>
            <button onclick="changeLang('ar')">AR</button>
        </div>
        <div class="top-controls">
            <button class="icon-btn" id="soundBtn" onclick="toggleSound()">🔊</button>
            <div class="icon-btn" onclick="toggleThemeManually()">🌓</div>
        </div>
        <div class="date-display" id="dateText"></div>
        <div class="clock-display" id="clockText">00:00:00</div>
        <h2 id="lbl-title" style="margin: 0;">تایمر تمرکز</h2>
        <div class="modes">
            <button id="m5" onclick="setTime(300, this)">۵ دقیقه</button>
            <button id="m25" class="active" onclick="setTime(1500, this)">۲۵ دقیقه</button>
            <button id="m50" onclick="setTime(3000, this)">۵۰ دقیقه</button>
        </div>
        <div class="time" id="display">25:00</div>
        <button class="main-btn" id="mainBtn" onclick="toggleTimer()">شروع</button>
        <button class="reset-btn" id="lbl-reset" onclick="resetTimer()">بازنشانی</button>
        <hr>
        <p style="margin: 0; font-size: 0.8rem; opacity: 0.7;" id="lbl-rounds">دورهای تمرکز: 0</p>
        <div class="task-input-group">
            <input type="text" id="taskInput" placeholder="کار جدید...">
            <button class="add-btn" onclick="addTask()">+</button>
        </div>
        <ul id="taskList"></ul>
    </div>

    <script>
        const translations = {
            fa: { title: "تایمر تمرکز", start: "شروع", stop: "توقف", reset: "بازنشانی", rounds: "دورهای تمرکز: ", taskPh: "کار جدید...", dir: "rtl", langCode: 'fa-IR', m5:"۵ دقیقه", m25:"۲۵ دقیقه", m50:"۵۰ دقیقه" },
            en: { title: "Focus Timer", start: "Start", stop: "Stop", reset: "Reset", rounds: "Focus Rounds: ", taskPh: "New task...", dir: "ltr", langCode: 'en-US', m5:"5 Min", m25:"25 Min", m50:"50 Min" },
            ar: { title: "مؤقت التركيز", start: "بدء", stop: "إيقاف", reset: "إعادة ضبط", rounds: "دورات التركيز: ", taskPh: "مهمة جديدة...", dir: "rtl", langCode: 'ar-SA', m5:"۵ دقائق", m25:"۲۵ دقيقة", m50:"۵۰ دقيقة" }
        };

        let timeLeft = 1500, timerId = null, currentLang = 'fa', rounds = 0, isMuted = false;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function updateClockAndDate() {
            const now = new Date();
            const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            
            document.getElementById('dateText').innerText = now.toLocaleDateString(translations[currentLang].langCode, dateOptions);
            document.getElementById('clockText').innerText = now.toLocaleTimeString(translations[currentLang].langCode, timeOptions);
            
            // سیستم تم خودکار بر اساس ساعت
            const hour = now.getHours();
            if (hour >= 6 && hour < 18) document.body.classList.add('light');
            else document.body.classList.remove('light');
        }

        function toggleThemeManually() { document.body.classList.toggle('light'); }

        function changeLang(lang) {
            currentLang = lang; const t = translations[lang];
            document.body.dir = t.dir;
            document.getElementById('lbl-title').innerText = t.title;
            document.getElementById('lbl-reset').innerText = t.reset;
            document.getElementById('lbl-rounds').innerText = t.rounds + rounds;
            document.getElementById('taskInput').placeholder = t.taskPh;
            document.getElementById('mainBtn').innerText = timerId ? t.stop : t.start;
            document.getElementById('m5').innerText = t.m5; document.getElementById('m25').innerText = t.m25; document.getElementById('m50').innerText = t.m50;
            const card = document.getElementById('mainCard');
            lang === 'en' ? card.classList.add('ltr-mode') : card.classList.remove('ltr-mode');
            updateClockAndDate();
        }

        function toggleTimer() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const btn = document.getElementById('mainBtn');
            if (timerId) { clearInterval(timerId); timerId = null; btn.innerText = currentLang==='en'?"Continue":"ادامه"; }
            else {
                btn.innerText = translations[currentLang].stop;
                timerId = setInterval(() => {
                    if (timeLeft > 0) { timeLeft--; updateDisplay(); }
                    else { clearInterval(timerId); timerId = null; rounds++; playSound(); changeLang(currentLang); alert("Time is up!"); }
                }, 1000);
            }
        }

        function playSound() { if (isMuted) return; const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination); osc.type = 'sine'; osc.frequency.value = 880; gain.gain.setValueAtTime(0, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.1); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1); osc.start(); osc.stop(audioCtx.currentTime + 1); }
        function toggleSound() { isMuted = !isMuted; document.getElementById('soundBtn').innerText = isMuted ? '🔇' : '🔊'; }
        function setTime(s, btn) { resetTimer(); timeLeft = s; updateDisplay(); document.querySelectorAll('.modes button').forEach(b => b.classList.remove('active')); btn.classList.add('active'); }
        function updateDisplay() { const m = Math.floor(timeLeft / 60), s = timeLeft % 60; document.getElementById('display').innerText = `${m}:${s < 10 ? '0' : ''}${s}`; }
        function resetTimer() { clearInterval(timerId); timerId = null; const activeBtn = document.querySelector('.modes button.active'); timeLeft = activeBtn.id === 'm5' ? 300 : (activeBtn.id === 'm50' ? 3000 : 1500); updateDisplay(); document.getElementById('mainBtn').innerText = translations[currentLang].start; }
        function addTask() { const input = document.getElementById('taskInput'); if (!input.value) return; const li = document.createElement('li'); li.innerHTML = `<span>${input.value}</span><span onclick="this.parentElement.remove()" style="cursor:pointer; color:#ef4444">✕</span>`; document.getElementById('taskList').appendChild(li); input.value = ''; }
        
        setInterval(updateClockAndDate, 1000); // آپدیت ثانیه‌شمار ساعت
        updateClockAndDate();
    </script>
</body>
</html>
