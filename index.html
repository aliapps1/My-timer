<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Timer Pro</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --primary: #22d3ee; }
        .light { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --primary: #0891b2; }
        body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; transition: 0.5s; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: var(--card); padding: 1.5rem; border-radius: 2.5rem; width: 100%; max-width: 360px; position: relative; text-align: right; border: 1px solid rgba(255,255,255,0.1); }
        
        /* اجبار به استفاده از اعداد انگلیسی در حالت EN */
        .ltr-mode { text-align: left !important; }
        .ltr-mode .time, .ltr-mode .modes button, .ltr-mode .clock-display { font-family: 'Arial', sans-serif !important; }

        .time { font-size: 5rem; font-weight: 800; margin: 10px 0; color: var(--primary); text-align: center; font-family: monospace; }
        .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 15px 0; }
        .modes button { background: rgba(51, 65, 85, 0.5); padding: 10px; color: white; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; font-size: 0.85rem; }
        .light .modes button { background: #e2e8f0; color: #475569; }
        .modes button.active { background: var(--primary); color: #0f172a; font-weight: bold; }
        
        .main-btn { width: 100%; padding: 1.2rem; border-radius: 18px; cursor: pointer; font-weight: 800; background: var(--primary); color: #0f172a; font-size: 1.3rem; border:none; }
        .lang-btns { position: absolute; top: -55px; left: 10px; display: flex; gap: 8px; direction: ltr !important; }
        .lang-btns button { padding: 8px 12px; background: var(--card); color: var(--text); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; cursor: pointer; font-weight: bold; }
        .top-controls { position: absolute; top: -55px; right: 10px; display: flex; gap: 10px; direction: ltr !important; }
    </style>
</head>
<body>
    <div class="card" id="mainCard">
        <div class="lang-btns">
            <button onclick="changeLang('en')">EN</button>
            <button onclick="changeLang('ar')">AR</button>
            <button onclick="changeLang('fa')">FA</button>
        </div>
        <div class="top-controls">
            <button id="soundBtn" onclick="toggleSound()" style="background:none; border:none; font-size:22px; cursor:pointer;">🔊</button>
            <div onclick="toggleThemeManually()" style="font-size:22px; cursor:pointer;">🌓</div>
        </div>
        <div id="dateText" style="color:var(--primary); font-size:0.85rem;"></div>
        <div id="clockText" class="clock-display" style="font-size:1.2rem; opacity:0.8; margin-bottom:15px;"></div>
        <h2 id="lbl-title">تایمر تمرکز</h2>
        <div class="modes">
            <button id="m5" onclick="setTime(300, this)">۵ د</button>
            <button id="m15" onclick="setTime(900, this)">۱۵ د</button>
            <button id="m25" class="active" onclick="setTime(1500, this)">۲۵ د</button>
            <button id="m40" onclick="setTime(2400, this)">۴۰ د</button>
            <button id="m60" onclick="setTime(3600, this)">۶۰ د</button>
            <button id="m90" onclick="setTime(5400, this)">۹۰ د</button>
        </div>
        <div class="time" id="display">25:00</div>
        <button class="main-btn" id="mainBtn" onclick="toggleTimer()">شروع</button>
        <p id="lbl-rounds" style="text-align:center; margin-top:15px;">دورهای تمرکز: 0</p>
    </div>

    <script>
        let duration = 1500, endTime = null, timerId = null, currentLang = 'fa', rounds = 0, isMuted = false;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        const translations = {
            fa: { title: "تایمر تمرکز", start: "شروع", stop: "توقف", cont: "ادامه", rounds: "دورهای تمرکز: ", m:["۵ د","۱۵ د","۲۵ د","۴۰ د","۶۰ د","۹۰ د"], dir: "rtl", lang: 'fa-IR' },
            en: { title: "Focus Timer", start: "Start", stop: "Stop", cont: "Continue", rounds: "Focus Rounds: ", m:["5m","15m","25m","40m","60m","90m"], dir: "ltr", lang: 'en-US' },
            ar: { title: "مؤقت التركيز", start: "بدء", stop: "إيقاف", cont: "متابعة", rounds: "دورات التركيز: ", m:["٥ د","١٥ د","٢٥ د","٤٠ د","٦٠ د","٩٠ د"], dir: "rtl", lang: 'ar-SA' }
        };

        function updateClockAndTheme() {
            const now = new Date();
            document.getElementById('clockText').innerText = now.toLocaleTimeString(translations[currentLang].lang, { hour12: false });
            document.getElementById('dateText').innerText = now.toLocaleDateString(translations[currentLang].lang, { weekday: 'long', month: 'long', day: 'numeric' });
            if (!localStorage.getItem('manualTheme')) {
                const hour = now.getHours();
                if (hour >= 6 && hour < 19) document.body.classList.add('light');
                else document.body.classList.remove('light');
            }
        }

        function changeLang(lang) {
            currentLang = lang; const t = translations[lang];
            document.body.dir = t.dir;
            document.getElementById('lbl-title').innerText = t.title;
            document.getElementById('lbl-rounds').innerText = t.rounds + (currentLang === 'en' ? rounds : rounds.toLocaleString(t.lang));
            
            // اصلاح متن دکمه‌های بازه زمانی
            const modeBtns = document.querySelectorAll('.modes button');
            modeBtns.forEach((btn, index) => { btn.innerText = t.m[index]; });

            const btn = document.getElementById('mainBtn');
            if(!timerId) btn.innerText = duration < 1500 ? t.cont : t.start;
            else btn.innerText = t.stop;

            const card = document.getElementById('mainCard');
            lang === 'en' ? card.classList.add('ltr-mode') : card.classList.remove('ltr-mode');
            updateDisplay(duration);
        }

        function updateDisplay(seconds) {
            const m = Math.floor(seconds / 60), s = seconds % 60;
            const timeString = `${m}:${s < 10 ? '0' : ''}${s}`;
            // در حالت انگلیسی، از فرمت بومی استفاده نمی‌کنیم تا اعداد فارسی نشوند
            document.getElementById('display').innerText = currentLang === 'en' ? timeString : timeString.toLocaleString(translations[currentLang].lang);
        }

        function toggleTimer() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const btn = document.getElementById('mainBtn');
            if (timerId) {
                duration = Math.ceil((endTime - Date.now()) / 1000);
                clearInterval(timerId); timerId = null;
                btn.innerText = translations[currentLang].cont;
            } else {
                endTime = Date.now() + (duration * 1000);
                btn.innerText = translations[currentLang].stop;
                timerId = setInterval(() => {
                    const remaining = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
                    updateDisplay(remaining);
                    if (remaining <= 0) {
                        clearInterval(timerId); timerId = null;
                        rounds++; playSound(); resetAfterFinish(); alert(currentLang === 'en' ? "Time is up!" : "زمان تمام شد!");
                    }
                }, 500);
            }
        }

        function playSound() {
            if (isMuted) return;
            for(let i = 0; i < 10; i++) {
                setTimeout(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.1);
                    osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.5);
                }, i * 1000);
            }
        }

        function setTime(s, btn) {
            clearInterval(timerId); timerId = null;
            duration = s; updateDisplay(s);
            document.querySelectorAll('.modes button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('mainBtn').innerText = translations[currentLang].start;
        }

        function resetAfterFinish() {
            const activeBtn = document.querySelector('.modes button.active');
            const times = {m5:300, m15:900, m25:1500, m40:2400, m60:3600, m90:5400};
            duration = times[activeBtn.id]; updateDisplay(duration);
            document.getElementById('mainBtn').innerText = translations[currentLang].start;
            document.getElementById('lbl-rounds').innerText = translations[currentLang].rounds + (currentLang === 'en' ? rounds : rounds.toLocaleString(translations[currentLang].lang));
        }

        function toggleThemeManually() { localStorage.setItem('manualTheme', 'true'); document.body.classList.toggle('light'); }
        function toggleSound() { isMuted = !isMuted; document.getElementById('soundBtn').innerText = isMuted ? '🔇' : '🔊'; }

        setInterval(updateClockAndTheme, 1000); updateClockAndTheme();
    </script>
</body>
</html>
