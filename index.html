<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Focus Timer Pro</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: white; --primary: #38bdf8; }
        .light-mode { --bg: #f1f5f9; --card: #ffffff; --text: #1e293b; --primary: #0284c7; }
        body { background: var(--bg); color: var(--text); text-align: center; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; transition: 0.5s; }
        .card { background: var(--card); padding: 2rem; border-radius: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); width: 85%; max-width: 400px; }
        #timer { font-size: 5rem; font-weight: bold; margin: 10px 0; color: var(--primary); }
        button { padding: 10px 15px; border-radius: 12px; border: none; background: var(--primary); color: white; font-weight: bold; cursor: pointer; margin: 5px; transition: 0.2s; }
        button:active { transform: scale(0.95); }
        .theme-btn { position: absolute; top: 20px; right: 20px; background: #475569; font-size: 1.2rem; }
        .stats { margin-top: 20px; font-size: 0.9rem; opacity: 0.8; border-top: 1px solid #ccc; padding-top: 10px; }
    </style>
</head>
<body>
    <button class="theme-btn" onclick="toggleTheme()">🌓</button>
    <div style="margin-bottom: 15px;">
        <button onclick="setLang('en')">EN</button>
        <button onclick="setLang('fa')">FA</button>
        <button onclick="setLang('ar')">AR</button>
    </div>
    <div class="card">
        <h2 id="title">زمان تمرکز</h2>
        <div id="timer">25:00</div>
        <div>
            <button onclick="setTime(5)">5m</button>
            <button onclick="setTime(25)">25m</button>
            <button onclick="setTime(50)">50m</button>
        </div>
        <button id="btn" style="width:100%; margin-top:20px; font-size:1.5rem; background: linear-gradient(135deg, #38bdf8, #818cf8);" onclick="startTimer()">شروع</button>
        <div class="stats">
            <span id="statText">مجموع تمرکز:</span> <span id="totalMins">0</span> <span id="unit">دقیقه</span>
        </div>
    </div>

    <script>
        let totalSeconds = 25 * 60;
        let selectedMins = 25;
        let cumulative = localStorage.getItem('focusScore') || 0;
        let audioCtx = null;
        document.getElementById('totalMins').innerText = cumulative;

        const trans = {
            en: { title: "Focus Timer", btn: "START", stats: "Total Focus:", unit: "mins", dir: "ltr", msg: "Time's up!" },
            fa: { title: "زمان تمرکز", btn: "شروع", stats: "مجموع تمرکز:", unit: "دقیقه", dir: "rtl", msg: "زمان تمام شد!" },
            ar: { title: "مؤقت التركيز", btn: "ابدأ", stats: "مجموع التركيز:", unit: "دقيقة", dir: "rtl", msg: "انتهى الوقت!" }
        };

        let currentMsg = trans.fa.msg;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // نت دو
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            osc.start();
            osc.stop(audioCtx.currentTime + 1.5);
        }

        function toggleTheme() { document.body.classList.toggle('light-mode'); }
        function setLang(lang) {
            const t = trans[lang];
            document.getElementById('title').innerText = t.title;
            document.getElementById('btn').innerText = t.btn;
            document.getElementById('statText').innerText = t.stats;
            document.getElementById('unit').innerText = t.unit;
            document.body.style.direction = t.dir;
            currentMsg = t.msg;
        }
        function setTime(m) { selectedMins = m; totalSeconds = m * 60; updateDisplay(); }
        function updateDisplay() {
            let m = Math.floor(totalSeconds / 60);
            let s = totalSeconds % 60;
            document.getElementById('timer').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function startTimer() {
            initAudio(); // فعال‌سازی سیستم صدا با کلیک کاربر
            const btn = document.getElementById('btn');
            btn.disabled = true;
            btn.style.opacity = "0.5";
            
            const timer = setInterval(() => {
                if(totalSeconds > 0) {
                    totalSeconds--;
                    updateDisplay();
                } else {
                    clearInterval(timer);
                    playSound(); 
                    setTimeout(() => alert(currentMsg), 100);
                    cumulative = parseInt(cumulative) + selectedMins;
                    localStorage.setItem('focusScore', cumulative);
                    document.getElementById('totalMins').innerText = cumulative;
                    btn.disabled = false;
                    btn.style.opacity = "1";
                }
            }, 1000);
        }
    </script>
</body>
</html>
