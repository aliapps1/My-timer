<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تایمر حرفه‌ای تمرکز</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { --bg: #f8fafc; --primary: #0284c7; --accent: #f59e0b; }
        body { background: var(--bg); font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 2.5rem; border-radius: 3rem; width: 90%; max-width: 380px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .time { font-size: 6rem; font-weight: 900; color: var(--primary); margin: 20px 0; font-family: monospace; direction: ltr; }
        .modes { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        button { padding: 12px; border-radius: 12px; border: 1px solid #e2e8f0; cursor: pointer; background: white; }
        .active { background: var(--primary); color: white; border: none; }
        .btn-start { background: var(--accent); color: white; width: 100%; padding: 20px; font-weight: bold; border: none; border-radius: 20px; font-size: 1.3rem; }
    </style>
</head>
<body>
    <div class="card">
        <h2>تایمر تمرکز Pro</h2>
        <div class="modes">
            <button onclick="setTime(10, this)">۱۰ ثانیه</button>
            <button class="active" onclick="setTime(300, this)">۵ دقیقه</button>
            <button onclick="setTime(1500, this)">۲۵ دقیقه</button>
        </div>
        <div class="time" id="display">05:00</div>
        <button class="btn-start" onclick="initTimer()">شروع تمرکز</button>
    </div>

    <audio id="alarmAudio" src="https://www.soundjay.com/clock/sounds/alarm-clock-01.mp3" preload="auto" loop></audio>

    <script>
        let duration = 300, timeLeft = 300, timerId = null, endTime = null, wakeLock = null;
        const alarm = document.getElementById('alarmAudio');

        async function initTimer() {
            if (timerId) return;

            // باز کردن قفل صدا
            try { await alarm.play(); alarm.pause(); alarm.currentTime = 0; } catch (e) {}

            // درخواست WakeLock
            if ('wakeLock' in navigator) {
                try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
            }

            // محاسبه زمان دقیق پایان (زمان فعلی + مدت تایمر)
            endTime = Date.now() + (timeLeft * 1000);
            
            runTimer();
        }

        function runTimer() {
            timerId = setInterval(() => {
                const now = Date.now();
                const remaining = Math.round((endTime - now) / 1000);

                if (remaining <= 0) {
                    timeLeft = 0;
                    updateDisplay();
                    finish();
                } else {
                    timeLeft = remaining;
                    updateDisplay();
                }
            }, 500); // چک کردن هر نیم ثانیه برای دقت بیشتر
        }

        function finish() {
            clearInterval(timerId);
            timerId = null;
            alarm.play();
            // ۱۵ ثانیه زنگ زدن
            setTimeout(() => { alarm.pause(); alarm.currentTime = 0; }, 15000);
            
            if (navigator.vibrate) navigator.vibrate([500, 200, 500, 200, 500]);
            if (wakeLock) { wakeLock.release(); wakeLock = null; }
        }

        function setTime(s, btn) {
            duration = s; timeLeft = s;
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            updateDisplay();
        }

        function updateDisplay() {
            const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
            document.getElementById('display').innerText = `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }
    </script>
</body>
</html>
