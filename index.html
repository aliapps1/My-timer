<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FocusTimer Pro</title>

<style>
body{
  font-family: system-ui;
  background:#0f172a;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}

.app{
  width:360px;
  background:#1e293b;
  padding:25px;
  border-radius:20px;
  box-shadow:0 0 30px rgba(0,0,0,.5);
  text-align:center;
}

h1{
  margin-bottom:10px;
  font-size:22px;
}

.timer{
  font-size:60px;
  margin:20px 0;
}

button{
  background:#facc15;
  border:none;
  padding:10px 16px;
  margin:5px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.secondary{
  background:#334155;
  color:white;
}

.stats{
  margin-top:20px;
  background:#0f172a;
  padding:12px;
  border-radius:12px;
  font-size:14px;
  line-height:1.8;
}

.lock{
  opacity:.4;
}

.share{
  margin-top:10px;
  background:#3b82f6;
  color:white;
}
</style>
</head>

<body>

<div class="app">

<h1>FocusTimer Pro</h1>

<div class="timer" id="time">25:00</div>

<button onclick="startTimer()">Start</button>
<button onclick="pauseTimer()" class="secondary">Pause</button>
<button onclick="resetTimer()" class="secondary">Reset</button>

<br/><br/>

<select id="soundSelect">
  <option value="">No Sound</option>
  <option value="rain.mp3">Rain (Premium)</option>
  <option value="cafe.mp3">Cafe (Premium)</option>
</select>

<div class="stats">
  ⏱ Today: <span id="today">0</span> min<br/>
  🔥 Streak: <span id="streak">0</span> days<br/>
  ⭐ Level: <span id="level">1</span>
</div>

<button class="share" onclick="shareResult()">Share Result</button>

<p style="margin-top:15px;font-size:12px;">
Unlock sounds & advanced stats with Premium
</p>

</div>

<script>
let duration = 25 * 60
let timeLeft = duration
let interval = null
let audio = new Audio()

const timeEl = document.getElementById("time")

function updateDisplay(){
  let m = Math.floor(timeLeft/60)
  let s = timeLeft%60
  timeEl.innerText =
    String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")
}

function startTimer(){
  if(interval) return

  const sound = document.getElementById("soundSelect").value

  // premium lock
  if(sound){
    alert("This sound is Premium 🔒")
  }

  interval = setInterval(()=>{
    timeLeft--

    if(timeLeft <= 0){
      completeSession()
      resetTimer()
    }

    updateDisplay()

  },1000)
}

function pauseTimer(){
  clearInterval(interval)
  interval=null
}

function resetTimer(){
  pauseTimer()
  timeLeft = duration
  updateDisplay()
}

function completeSession(){
  let today = getTodayKey()

  let stats = JSON.parse(localStorage.getItem("stats")||"{}")

  stats[today] = (stats[today]||0) + 25

  localStorage.setItem("stats",JSON.stringify(stats))

  updateStats()
}

function getTodayKey(){
  return new Date().toISOString().slice(0,10)
}

function updateStats(){
  let stats = JSON.parse(localStorage.getItem("stats")||"{}")

  let today = stats[getTodayKey()] || 0
  document.getElementById("today").innerText = today

  let days = Object.keys(stats).length
  document.getElementById("streak").innerText = days

  let level = Math.floor(today/60)+1
  document.getElementById("level").innerText = level
}

function shareResult(){
  const today = document.getElementById("today").innerText
  const streak = document.getElementById("streak").innerText
  const level = document.getElementById("level").innerText

  const text = `I focused ${today} min today with FocusTimer Pro! 🔥 Streak: ${streak} days, Level: ${level}. Can you beat me?`
  
  if(navigator.share){
    navigator.share({text})
  } else {
    prompt("Copy & share your result:", text)
  }
}

updateDisplay()
updateStats()
</script>

</body>
</html>
