<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تایمر تمرکز</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { --bg: #f0f2f5; --primary: #0284c7; }
        body { background: var(--bg); font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 2rem; width: 90%; max-width: 350px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .time { font-size: 5rem; font-weight: bold; color: var(--primary); margin: 20px 0; }
        .modes { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        button { padding: 10px 20px; border-radius: 10px; border: 1px solid #ddd; cursor: pointer; }
        .active { background: var(--primary); color: white; border: none; }
        .btn-start { background: #f59e0b; color: white; width: 100%; padding: 15px; font-weight: bold; border: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>تایمر تمرکز Pro</h2>
        <div class="modes">
            <button onclick="setTime(10, this)">۱۰ ثانیه</button>
            <button class="active" onclick="setTime(1500, this)">۲۵ دقیقه</button>
        </div>
        <div class="time" id="display">۲۵:۰۰</div>
        <button class="btn-start" id="startBtn" onclick="startTimer()">شروع تمرکز</button>
    </div>

    <audio id="alarmAudio" src="https://assets.mixkit.co/active_storage/sfx/930/930-preview.mp3" loop></audio>

    <script>
        let duration = 1500, timeLeft = 1500, timerId = null, wakeLock = null;

        // اجازه گرفتن برای نوتیفیکیشن (حیاتی برای خاموشی اسکرین)
        if (Notification.permission !== "granted") {
            Notification.requestPermission();
        }

        async function startTimer() {
            if (timerId) return;
            
            // فعال سازی بیدارباش
            if ('wakeLock' in navigator) {
                try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
            }

            timerId = setInterval(() => {
                timeLeft--;
                updateDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerId);
                    timerId = null;
                    playAlarm();
                    if (wakeLock) wakeLock.release();
                }
            }, 1000);
        }

        function playAlarm() {
            const alarm = document.getElementById('alarmAudio');
            alarm.play();
            
            // ارسال نوتیفیکیشن برای بیدار کردن گوشی
            if (Notification.permission === "granted") {
                new Notification("زمان تمام شد!", {
                    body: "وقت استراحت است. ساعت کوکی بیدارباش!",
                    icon: "icon.png"
                });
            }
        }

        function setTime(s, btn) {
            duration = s; timeLeft = s;
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            updateDisplay();
        }

        function updateDisplay() {
            const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
            document.getElementById('display').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
        }
    </script>
</body>
</html>
