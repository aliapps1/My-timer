<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Timer Pro | Multi-Lang</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --primary: #22d3ee; --accent: #fbbf24; }
        .light { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --primary: #0891b2; }
        body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; transition: 0.5s; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: var(--card); padding: 1.5rem; border-radius: 2.5rem; width: 100%; max-width: 380px; text-align: right; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); }
        
        /* اصلاح بخش دکمه‌های بالای صفحه */
        .header-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .lang-group { display: flex; gap: 5px; }
        .nav-btn { padding: 6px 10px; background: rgba(51, 65, 85, 0.5); color: white; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; cursor: pointer; font-size: 11px; font-weight: bold; }

        .time { font-size: 5.5rem; font-weight: 800; margin: 5px 0; color: var(--primary); text-align: center; font-family: monospace; }
        .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 15px 0; }
        .modes button { background: rgba(51, 65, 85, 0.5); padding: 10px; color: white; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; font-size: 0.8rem; }
        .modes button.active { background: var(--primary); color: #0f172a; font-weight: bold; }

        .controls { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; margin-top: 15px; }
        .btn-main { padding: 15px; border-radius: 15px; border: none; font-weight: bold; cursor: pointer; font-size: 0.95rem; }
        .btn-start { background: var(--accent); color: #0f172a; }
        .btn-pause { background: #334155; color: white; }
        .btn-reset { background: #ef4444; color: white; }

        .stats-card { background: rgba(15, 23, 42, 0.4); border-radius: 20px; padding: 15px; margin: 20px 0; border: 1px solid rgba(255,255,255,0.05); }
        .stat-item { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 0.9rem; }
        .level-badge { color: var(--accent); font-weight: bold; }

        .sound-select { width: 100%; padding: 10px; border-radius: 10px; background: #334155; color: white; border: none; margin: 10px 0; outline: none; }
        .share-btn { width: 100%; padding: 12px; background: #3b82f6; color: white; border-radius: 15px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        .visitor-section { text-align: center; margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 15px; opacity: 0.6; }
        .ltr-mode { text-align: left !important; direction: ltr; }
    </style>
</head>
<body>
    <div class="card" id="mainCard">
        <div class="header-controls">
            <div class="lang-group">
                <button class="nav-btn" onclick="changeLang('en')">EN</button>
                <button class="nav-btn" onclick="changeLang('ar')">AR</button>
                <button class="nav-btn" onclick="changeLang('fa')">FA</button>
            </div>
            <div class="lang-group">
                <button class="nav-btn" id="muteBtn" onclick="toggleMute()">🔊</button>
                <button class="nav-btn" onclick="toggleTheme()">🌓</button>
            </div>
        </div>

        <div id="dateText" style="color:var(--primary); font-size:0.8rem;"></div>
        <div id="clockText" style="font-size:1.1rem; opacity:0.7; margin-bottom:10px;"></div>
        <h2 id="lbl-title">تایمر تمرکز</h2>

        <select id="ambientSound" class="sound-select" onchange="changeAmbient()">
            <option value="none" id="opt-none">بدون صدا</option>
            <option value="rain" id="opt-rain">صدای باران</option>
            <option value="cafe" id="opt-cafe">صدای کافه</option>
        </select>

        <div class="modes">
            <button id="m5" onclick="setTime(300, this)">۵ د</button>
            <button id="m15" onclick="setTime(900, this)">۱۵ د</button>
            <button id="m25" class="active" onclick="setTime(1500, this)">۲۵ د</button>
            <button id="m40" onclick="setTime(2400, this)">۴۰ د</button>
            <button id="m60" onclick="setTime(3600, this)">۶۰ د</button>
            <button id="m90" onclick="setTime(5400, this)">۹۰ د</button>
        </div>

        <div class="time" id="display">25:00</div>

        <div class="controls">
            <button class="btn-main btn-start" id="btn-start" onclick="startTimer()">شروع</button>
            <button class="btn-main btn-pause" id="btn-pause" onclick="pauseTimer()">توقف</button>
            <button class="btn-main btn-reset" id="btn-reset" onclick="resetTimer()">ریست</button>
        </div>

        <div class="stats-card">
            <div class="stat-item"><span id="lbl-today">⏱️ امروز:</span> <span id="stat-today">0 دقیقه</span></div>
            <div class="stat-item"><span id="lbl-streak">🔥 زنجیره:</span> <span id="stat-streak">0 روز</span></div>
            <div class="stat-item"><span id="lbl-level">⭐ سطح:</span> <span id="stat-level" class="level-badge">Level 1</span></div>
        </div>

        <button class="share-btn" id="btn-share" onclick="shareStats()">اشتراک‌گذاری نتیجه</button>

        <div class="visitor-section">
            <img src="https://komarev.com/ghpvc/?username=aliapps1-timer&color=22d3ee&style=flat-square&label=VISITS" alt="Views">
        </div>
    </div>

    <audio id="rainAudio" loop src="https://www.soundjay.com/nature/rain-01.mp3"></audio>
    <audio id="cafeAudio" loop src="https://www.soundjay.com/misc/sounds/coffee-shop-1.mp3"></audio>

    <script>
        let duration = 1500, timeLeft = 1500, timerId = null, currentLang = 'fa', isMuted = false;
        let stats = JSON.parse(localStorage.getItem('focusStats')) || { totalMin: 0, streak: 0, lastDate: null };

        const translations = {
            fa: { title: "تایمر تمرکز", start: "شروع", pause: "توقف", reset: "ریست", share: "اشتراک‌گذاری نتیجه", today: "⏱️ امروز:", streak: "🔥 زنجیره:", level: "⭐ سطح:", rain: "صدای باران", cafe: "صدای کافه", none: "بدون صدا", min: "دقیقه", day: "روز", m:["۵ د","۱۵ د","۲۵ د","۴۰ د","۶۰ د","۹۰ د"], lang: 'fa-IR', dir: 'rtl' },
            en: { title: "Focus Timer", start: "Start", pause: "Pause", reset: "Reset", share: "Share Result", today: "⏱️ Today:", streak: "🔥 Streak:", level: "⭐ Level:", rain: "Rain Sound", cafe: "Cafe Sound", none: "No Sound", min: "min", day: "days", m:["5m","15m","25m","40m","60m","90m"], lang: 'en-US', dir: 'ltr' },
            ar: { title: "مؤقت التركيز", start: "بدء", pause: "إيقاف", reset: "إعادة", share: "مشاركة النتيجة", today: "⏱️ اليوم:", streak: "🔥 متسلسل:", level: "⭐ مستوى:", rain: "صوت المطر", cafe: "صوت المقهى", none: "بدون صوت", min: "دقيقة", day: "يوم", m:["٥ د","١٥ د","٢٥ د","٤٠ د","٦٠ د","٩٠ د"], lang: 'ar-SA', dir: 'rtl' }
        };

        function updateUI() {
            const t = translations[currentLang];
            document.body.dir = t.dir;
            document.getElementById('lbl-title').innerText = t.title;
            document.getElementById('btn-start').innerText = t.start;
            document.getElementById('btn-pause').innerText = t.pause;
            document.getElementById('btn-reset').innerText = t.reset;
            document.getElementById('btn-share').innerText = t.share;
            document.getElementById('lbl-today').innerText = t.today;
            document.getElementById('lbl-streak').innerText = t.streak;
            document.getElementById('lbl-level').innerText = t.level;
            document.getElementById('opt-none').innerText = t.none;
            document.getElementById('opt-rain').innerText = t.rain;
            document.getElementById('opt-cafe').innerText = t.cafe;
            
            document.querySelectorAll('.modes button').forEach((btn, i) => btn.innerText = t.m[i]);
            
            document.getElementById('stat-today').innerText = (currentLang === 'en' ? stats.totalMin : stats.totalMin.toLocaleString(t.lang)) + " " + t.min;
            document.getElementById('stat-streak').innerText = (currentLang === 'en' ? stats.streak : stats.streak.toLocaleString(t.lang)) + " " + t.day;
            document.getElementById('stat-level').innerText = "Level " + (Math.floor(stats.totalMin / 100) + 1);

            currentLang === 'en' ? document.getElementById('mainCard').classList.add('ltr-mode') : document.getElementById('mainCard').classList.remove('ltr-mode');
        }

        function startTimer() {
            if (timerId) return;
            timerId = setInterval(() => {
                timeLeft--; updateDisplay();
                if (timeLeft <= 0) { clearInterval(timerId); timerId = null; completeSession(); }
            }, 1000);
            changeAmbient();
        }

        function pauseTimer() { clearInterval(timerId); timerId = null; stopAmbient(); }
        function resetTimer() { pauseTimer(); timeLeft = duration; updateDisplay(); }
        function setTime(s, btn) { duration = s; timeLeft = s; document.querySelectorAll('.modes button').forEach(b => b.classList.remove('active')); btn.classList.add('active'); updateDisplay(); }

        function updateDisplay() {
            const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
            const str = `${m}:${s < 10 ? '0' : ''}${s}`;
            document.getElementById('display').innerText = currentLang === 'en' ? str : str.toLocaleString(translations[currentLang].lang);
        }

        function completeSession() {
            stats.totalMin += Math.floor(duration / 60);
            const today = new Date().toDateString();
            if (stats.lastDate !== today) { stats.streak++; stats.lastDate = today; }
            localStorage.setItem('focusStats', JSON.stringify(stats));
            updateUI();
            alert(currentLang === 'en' ? "Time is up!" : (currentLang === 'ar' ? "انتهى الوقت!" : "زمان تمام شد!"));
            resetTimer();
        }

        function shareStats() {
            const t = translations[currentLang];
            const text = `${t.title}: ${stats.totalMin} ${t.min} | ${t.streak} ${t.day} | Level ${Math.floor(stats.totalMin / 100) + 1}`;
            navigator.clipboard.writeText(text);
            alert(currentLang === 'en' ? "Copied!" : "کپی شد!");
        }

        function changeAmbient() {
            stopAmbient();
            const val = document.getElementById('ambientSound').value;
            if (val !== 'none' && !isMuted && timerId) document.getElementById(val + 'Audio').play();
        }

        function stopAmbient() { document.getElementById('rainAudio').pause(); document.getElementById('cafeAudio').pause(); }
        function toggleMute() { isMuted = !isMuted; document.getElementById('muteBtn').innerText = isMuted ? '🔇' : '🔊'; if (isMuted) stopAmbient(); else changeAmbient(); }
        function toggleTheme() { document.body.classList.toggle('light'); }
        function changeLang(l) { currentLang = l; updateUI(); updateDisplay(); }

        setInterval(() => {
            const now = new Date();
            document.getElementById('clockText').innerText = now.toLocaleTimeString(translations[currentLang].lang);
            document.getElementById('dateText').innerText = now.toLocaleDateString(translations[currentLang].lang, {weekday:'long', month:'long', day:'numeric'});
        }, 1000);

        updateUI(); updateDisplay();
    </script>
</body>
</html>
