<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تایمر حرفه‌ای</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --primary: #22d3ee; }
        .light { --bg: #f0f2f5; --card: #ffffff; --text: #1c1e21; --primary: #0891b2; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; transition: 0.3s; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: var(--card); padding: 1.5rem; border-radius: 2rem; box-shadow: 0 20px 50px rgba(0,0,0,0.2); text-align: center; width: 320px; border: 1px solid #334155; }
        .time { font-size: 4rem; font-weight: 800; margin: 1rem 0; color: var(--primary); font-family: monospace; }
        .lang-btns { position: absolute; top: 20px; left: 20px; display: flex; gap: 5px; }
        .lang-btns button { font-size: 10px; padding: 5px; background: #334155; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .main-btn { width: 100%; padding: 0.8rem; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; background: var(--primary); color: #0f172a; font-size: 1.1rem; }
    </style>
</head>
<body>
    <div class="lang-btns">
        <button onclick="changeLang('fa')">FA</button>
        <button onclick="changeLang('en')">EN</button>
        <button onclick="changeLang('ar')">AR</button>
    </div>
    <div style="position: absolute; top: 20px; right: 20px; cursor: pointer; font-size: 24px;" onclick="document.body.classList.toggle('light')">🌓</div>

    <div class="card">
        <h2 id="lbl-title">تایمر تمرکز</h2>
        <div class="time" id="display">25:00</div>
        <button class="main-btn" id="mainBtn" onclick="toggleTimer()">شروع</button>
    </div>

    <audio id="alarm" src="https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg"></audio>

    <script>
        const trans = {
            fa: { title: "تایمر تمرکز", start: "شروع", stop: "توقف", dir: "rtl" },
            en: { title: "Focus Timer", start: "Start", stop: "Stop", dir: "ltr" },
            ar: { title: "مؤقت التركيز", start: "بدء", stop: "إيقاف", dir: "rtl" }
        };
        let timeLeft = 1500, timerId = null, currentLang = 'fa';

        function changeLang(l) {
            currentLang = l;
            document.body.dir = trans[l].dir;
            document.getElementById('lbl-title').innerText = trans[l].title;
            document.getElementById('mainBtn').innerText = timerId ? trans[l].stop : trans[l].start;
        }

        function toggleTimer() {
            const btn = document.getElementById('mainBtn');
            if (timerId) {
                clearInterval(timerId); timerId = null;
                btn.innerText = currentLang === 'en' ? "Continue" : "ادامه";
            } else {
                btn.innerText = trans[currentLang].stop;
                timerId = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
                        document.getElementById('display').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
                    } else {
                        clearInterval(timerId); timerId = null;
                        document.getElementById('alarm').play();
                        alert("Done!");
                    }
                }, 1000);
            }
        }
    </script>
</body>
</html>
