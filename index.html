<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Timer</title>
    <link rel="icon" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --primary: #22d3ee; }
        .light { --bg: #f0f2f5; --card: #ffffff; --text: #1c1e21; --primary: #0891b2; }
        body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; transition: 0.3s; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: var(--card); padding: 1.5rem; border-radius: 2rem; box-shadow: 0 20px 50px rgba(0,0,0,0.2); width: 100%; max-width: 340px; border: 1px solid #334155; position: relative; text-align: right; }
        .ltr-mode { text-align: left !important; }
        .date-display { font-size: 0.85rem; color: var(--primary); margin-bottom: 5px; opacity: 0.9; }
        .time { font-size: 4.5rem; font-weight: 800; margin: 0.5rem 0; color: var(--primary); font-family: monospace; text-align: center; }
        .modes { display: flex; justify-content: space-between; margin: 15px 0; gap: 5px; }
        .modes button { background: #334155; font-size: 0.7rem; padding: 10px 5px; color: white; border: none; border-radius: 10px; flex: 1; cursor: pointer; }
        .modes button.active { background: var(--primary); color: #0f172a; font-weight: bold; }
        .main-btn { width: 100%; padding: 1rem; border: none; border-radius: 15px; cursor: pointer; font-weight: bold; background: var(--primary); color: #0f172a; font-size: 1.2rem; }
        .reset-btn { background: none; border: none; color: #64748b; cursor: pointer; margin-top: 10px; font-size: 0.9rem; text-decoration: underline; width: 100%; text-align: center; }
        .lang-btns { position: absolute; top: -50px; left: 0; display: flex; gap: 5px; }
        .lang-btns button { font-size: 11px; padding: 6px 10px; background: #334155; color: white; border: none; border-radius: 8px; cursor: pointer; }
        .theme-btn { position: absolute; top: -50px; right: 0; font-size: 24px; cursor: pointer; }
        hr { border: 0; border-top: 1px solid #334155; margin: 20px 0; }
        .task-section { text-align: inherit; }
        .task-input-group { display: flex; gap: 5px; margin-top: 10px; }
        input { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: white; }
        .add-btn { background: var(--primary); border: none; padding: 10px 15px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        ul { list-style: none; padding: 0; margin-top: 15px; text-align: inherit; }
        li { background: #334155; margin-bottom: 5px; padding: 8px 12px; border-radius: 8px; font-size: 0.9rem; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div class="card" id="mainCard">
        <div class="lang-btns">
            <button onclick="changeLang('fa')">FA</button>
            <button onclick="changeLang('en')">EN</button>
            <button onclick="changeLang('ar')">AR</button>
        </div>
        <div class="theme-btn" onclick="document.body.classList.toggle('light')">🌓</div>

        <div class="date-display" id="dateText"></div>
        <h2 id="lbl-title" style="margin: 0;">تایمر تمرکز</h2>
        
        <div class="modes">
            <button id="m5" onclick="setTime(300, this)">۵ دقیقه</button>
            <button id="m25" class="active" onclick="setTime(1500, this)">۲۵ دقیقه</button>
            <button id="m50" onclick="setTime(3000, this)">۵۰ دقیقه</button>
        </div>

        <div class="time" id="display">25:00</div>
        <button class="main-btn" id="mainBtn" onclick="toggleTimer()">شروع</button>
        <button class="reset-btn" id="lbl-reset" onclick="resetTimer()">بازنشانی</button>

        <hr>
        <div class="task-section">
            <p style="margin: 0; font-size: 0.8rem; opacity: 0.7;" id="lbl-rounds">دورهای تمرکز: 0</p>
            <div class="task-input-group">
                <input type="text" id="taskInput" placeholder="کار جدید...">
                <button class="add-btn" onclick="addTask()">+</button>
            </div>
            <ul id="taskList"></ul>
        </div>
    </div>

    <script>
        const translations = {
            fa: { title: "تایمر تمرکز", start: "شروع", stop: "توقف", reset: "بازنشانی", rounds: "دورهای تمرکز: ", taskPh: "کار جدید...", dir: "rtl", langCode: 'fa-IR' },
            en: { title: "Focus Timer", start: "Start", stop: "Stop", reset: "Reset", rounds: "Focus Rounds: ", taskPh: "New task...", dir: "ltr", langCode: 'en-US' },
            ar: { title: "مؤقت التركيز", start: "بدء", stop: "إيقاف", reset: "إعادة ضبط", rounds: "دورات التركيز: ", taskPh: "مهمة جديدة...", dir: "rtl", langCode: 'ar-SA' }
        };

        let timeLeft = 1500, timerId = null, currentLang = 'fa', rounds = 0;

        function updateDate() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('dateText').innerText = new Date().toLocaleDateString(translations[currentLang].langCode, options);
        }

        function changeLang(lang) {
            currentLang = lang;
            const t = translations[lang];
            document.body.dir = t.dir;
            document.getElementById('lbl-title').innerText = t.title;
            document.getElementById('lbl-reset').innerText = t.reset;
            document.getElementById('lbl-rounds').innerText = t.rounds + rounds;
            document.getElementById('taskInput').placeholder = t.taskPh;
            document.getElementById('mainBtn').innerText = timerId ? t.stop : t.start;
            
            const card = document.getElementById('mainCard');
            lang === 'en' ? card.classList.add('ltr-mode') : card.classList.remove('ltr-mode');
            updateDate();
        }

        function setTime(s, btn) {
            resetTimer(); timeLeft = s; updateDisplay();
            document.querySelectorAll('.modes button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function updateDisplay() {
            const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
            document.getElementById('display').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function toggleTimer() {
            const btn = document.getElementById('mainBtn');
            if (timerId) { clearInterval(timerId); timerId = null; btn.innerText = "ادامه"; }
            else {
                btn.innerText = translations[currentLang].stop;
                timerId = setInterval(() => {
                    if (timeLeft > 0) { timeLeft--; updateDisplay(); }
                    else { clearInterval(timerId); timerId = null; rounds++; changeLang(currentLang); alert("Done!"); }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerId); timerId = null;
            const activeBtn = document.querySelector('.modes button.active');
            timeLeft = activeBtn.id === 'm5' ? 300 : (activeBtn.id === 'm50' ? 3000 : 1500);
            updateDisplay();
            document.getElementById('mainBtn').innerText = translations[currentLang].start;
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            if (!input.value) return;
            const li = document.createElement('li');
            li.innerHTML = `${input.value} <span onclick="this.parentElement.remove()" style="cursor:pointer">×</span>`;
            document.getElementById('taskList').appendChild(li);
            input.value = '';
        }

        updateDate();
    </script>
</body>
</html>
