name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          npm install
          npm install -g @capacitor/cli
          pip install Pillow

      - name: Prepare WWW folder
        run: |
          mkdir -p www
          [ -f index.html ]    && cp index.html www/    || echo "no index.html"
          [ -f manifest.json ] && cp manifest.json www/ || true
          [ -f sw.js ]         && cp sw.js www/         || true
          for f in *.png; do [ -f "$f" ] && cp "$f" www/ || true; done

      - name: Capacitor Sync
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Generate App Icons
        run: |
          python3 << 'PYEOF'
          from PIL import Image
          import os
          src = "icon-512.png" if os.path.exists("icon-512.png") else "icon-192.png"
          img = Image.open(src).convert("RGBA")
          sizes = {
              "android/app/src/main/res/mipmap-mdpi": 48,
              "android/app/src/main/res/mipmap-hdpi": 72,
              "android/app/src/main/res/mipmap-xhdpi": 96,
              "android/app/src/main/res/mipmap-xxhdpi": 144,
              "android/app/src/main/res/mipmap-xxxhdpi": 192,
          }
          for folder, size in sizes.items():
              os.makedirs(folder, exist_ok=True)
              resized = img.resize((size, size), Image.LANCZOS)
              resized.save(f"{folder}/ic_launcher.png")
              resized.save(f"{folder}/ic_launcher_round.png")
              resized.save(f"{folder}/ic_launcher_foreground.png")
              print(f"✅ {size}x{size} → {folder}")
          print("🎉 Icons done!")
          PYEOF

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusChampion-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
