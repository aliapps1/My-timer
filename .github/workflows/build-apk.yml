name: Build Android APK + AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          npm install
          npm install -g @capacitor/cli
          pip install Pillow

      - name: Prepare WWW folder
        run: |
          mkdir -p www
          [ -f index.html ]    && cp index.html www/    || true
          [ -f manifest.json ] && cp manifest.json www/ || true
          [ -f sw.js ]         && cp sw.js www/         || true
          for f in *.png; do [ -f "$f" ] && cp "$f" www/ || true; done

      - name: Capacitor Sync
        run: |
          if [ ! -d "android" ]; then npx cap add android; fi
          npx cap sync android

      - name: Fix App Name
        run: |
          sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">Focus Champion</string>|g' android/app/src/main/res/values/strings.xml || true

      - name: Add Background Timer Service
        run: |
          JAVA_DIR="android/app/src/main/java/com/aliapps1/focuschampion"
          mkdir -p "$JAVA_DIR"
          
          echo "" | base64 -d > "$JAVA_DIR/TimerForegroundService.java"
          
          echo "cGFja2FnZSBjb20uYWxpYXBwczEuZm9jdXNjaGFtcGlvbjsKcHVibGljIGNsYXNzIE1haW5BY3Rpdml0eSBleHRlbmRzIEJyaWRnZUFjdGl2aXR5IHt9" | base64 -d > "$JAVA_DIR/MainActivity.java"
          
          python3 << 'PYEOF'
import re
manifest_path = "android/app/src/main/AndroidManifest.xml"
with open(manifest_path) as f:
    content = f.read()
content = content.replace("com.focuschampion.app", "com.aliapps1.focuschampion")
with open(manifest_path, 'w') as f:
    f.write(content)
print("Manifest updated OK")
PYEOF

      - name: Generate App Icons
        run: |
          python3 << 'PYEOF'
          from PIL import Image
          import os
          src = "icon-512.png" if os.path.exists("icon-512.png") else "icon-192.png"
          img = Image.open(src).convert("RGBA")
          sizes = {
              "android/app/src/main/res/mipmap-mdpi": 48,
              "android/app/src/main/res/mipmap-hdpi": 72,
              "android/app/src/main/res/mipmap-xhdpi": 96,
              "android/app/src/main/res/mipmap-xxhdpi": 144,
              "android/app/src/main/res/mipmap-xxxhdpi": 192,
          }
          for folder, size in sizes.items():
              os.makedirs(folder, exist_ok=True)
              r = img.resize((size, size), Image.LANCZOS)
              r.save(f"{folder}/ic_launcher.png")
              r.save(f"{folder}/ic_launcher_round.png")
              r.save(f"{folder}/ic_launcher_foreground.png")
          PYEOF

      - name: Generate Keystore
        run: |
          echo "" | base64 -d > focuschampion.keystore

      - name: Set Version
        run: |
          python3 << 'PYEOF'
          import re
          gradle = open("android/app/build.gradle").read()
          gradle = re.sub(r'versionCode\s+\d+', 'versionCode 1', gradle)
          gradle = re.sub(r'versionName\s+"[^"]+"', 'versionName "1.0.0"', gradle)
          open("android/app/build.gradle", "w").write(gradle)
          PYEOF

      - name: Build Release APK and AAB
        run: |
          cd android && chmod +x gradlew
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/../focuschampion.keystore \
            -Pandroid.injected.signing.store.password="Ali@191349" \
            -Pandroid.injected.signing.key.alias=focuschampion \
            -Pandroid.injected.signing.key.password="Ali@191349"

      - name: Upload Keystore Backup
        uses: actions/upload-artifact@v4
        with:
          name: KEYSTORE-BACKUP-SAVE-OFFLINE
          path: focuschampion.keystore
          retention-days: 7

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusChampion-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: FocusChampion-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
