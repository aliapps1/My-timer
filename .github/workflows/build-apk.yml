name: Build Android APK + AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          npm install
          npm install -g @capacitor/cli
          pip install Pillow

      - name: Prepare WWW folder
        run: |
          mkdir -p www
          [ -f index.html ]    && cp index.html www/    || true
          [ -f manifest.json ] && cp manifest.json www/ || true
          [ -f sw.js ]         && cp sw.js www/         || true
          for f in *.png; do [ -f "$f" ] && cp "$f" www/ || true; done

      - name: Capacitor Sync
        run: |
          if [ ! -d "android" ]; then npx cap add android; fi
          npx cap sync android

      - name: Generate App Icons
        run: |
          python3 << 'PYEOF'
          from PIL import Image
          import os
          src = "icon-512.png" if os.path.exists("icon-512.png") else "icon-192.png"
          img = Image.open(src).convert("RGBA")
          sizes = {
              "android/app/src/main/res/mipmap-mdpi": 48,
              "android/app/src/main/res/mipmap-hdpi": 72,
              "android/app/src/main/res/mipmap-xhdpi": 96,
              "android/app/src/main/res/mipmap-xxhdpi": 144,
              "android/app/src/main/res/mipmap-xxxhdpi": 192,
          }
          for folder, size in sizes.items():
              os.makedirs(folder, exist_ok=True)
              resized = img.resize((size, size), Image.LANCZOS)
              resized.save(f"{folder}/ic_launcher.png")
              resized.save(f"{folder}/ic_launcher_round.png")
              resized.save(f"{folder}/ic_launcher_foreground.png")
              print(f"✅ {size}x{size} done")
          PYEOF

      - name: Generate Keystore (only if not exists in secrets)
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "⚠️ No Keystore in secrets - generating new one..."
            keytool -genkeypair \
              -alias focuschampion \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -keystore focuschampion.keystore \
              -storepass "Ali@191349" \
              -keypass "Ali@191349" \
              -dname "CN=aliapps, OU=aliapps, O=aliapps, L=Dubai, ST=Dubai, C=AE" \
              -noprompt
            echo "✅ Keystore generated!"
            base64 focuschampion.keystore > keystore_base64.txt
            echo "📋 Add this to GitHub Secrets as KEYSTORE_BASE64:"
            cat keystore_base64.txt
          else
            echo "✅ Using Keystore from GitHub Secrets"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > focuschampion.keystore
          fi

      - name: Configure Signing
        run: |
          cat >> android/app/build.gradle << 'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file("../../../focuschampion.keystore")
                      storePassword "Ali@191349"
                      keyAlias "focuschampion"
                      keyPassword "Ali@191349"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          GRADLE

      - name: Build APK and AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      - name: Upload Keystore (⚠️ SAVE THIS OFFLINE!)
        uses: actions/upload-artifact@v4
        with:
          name: KEYSTORE-BACKUP-SAVE-OFFLINE
          path: focuschampion.keystore
          retention-days: 1

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusChampion-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload Release AAB (for Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: FocusChampion-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
