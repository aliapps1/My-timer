name: Build Android APK + AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          npm install
          npm install -g @capacitor/cli
          pip install Pillow

      - name: Prepare WWW folder
        run: |
          mkdir -p www
          [ -f index.html ]    && cp index.html www/    || true
          [ -f manifest.json ] && cp manifest.json www/ || true
          [ -f sw.js ]         && cp sw.js www/         || true
          for f in *.png; do [ -f "$f" ] && cp "$f" www/ || true; done

      - name: Capacitor Sync
        run: |
          if [ ! -d "android" ]; then npx cap add android; fi
          npx cap sync android

      - name: Fix App Name
        run: |
          sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">Focus Champion</string>|g' android/app/src/main/res/values/strings.xml || true

      - name: Add Background Timer Service
        run: |
          JAVA_DIR="android/app/src/main/java/com/aliapps1/focuschampion"
          mkdir -p "$JAVA_DIR"
          
          cat > "$JAVA_DIR/TimerForegroundService.java" << 'EOF'
package com.aliapps1.focuschampion;
import android.app.Service;
import android.content.Intent;
import android.os.IBinder;
public class TimerForegroundService extends Service {
    public static final String CHANNEL_ID = "FocusTimerChannel";
    public IBinder onBind(Intent intent) { return null; }
}
EOF
          
          cat > "$JAVA_DIR/MainActivity.java" << 'EOF'
package com.aliapps1.focuschampion;
import com.getcapacitor.BridgeActivity;
public class MainActivity extends BridgeActivity {}
EOF
          
          sed -i 's/com.focuschampion.app/com.aliapps1.focuschampion/g' android/app/src/main/AndroidManifest.xml

      - name: Generate App Icons
        run: |
          python3 << 'PYEOF'
from PIL import Image
import os
src = "icon-512.png" if os.path.exists("icon-512.png") else "icon-192.png"
img = Image.open(src).convert("RGBA")
sizes = {
    "android/app/src/main/res/mipmap-mdpi": 48,
    "android/app/src/main/res/mipmap-hdpi": 72,
    "android/app/src/main/res/mipmap-xhdpi": 96,
    "android/app/src/main/res/mipmap-xxhdpi": 144,
    "android/app/src/main/res/mipmap-xxxhdpi": 192,
}
for folder, size in sizes.items():
    os.makedirs(folder, exist_ok=True)
    r = img.resize((size, size), Image.LANCZOS)
    r.save(f"{folder}/ic_launcher.png")
    r.save(f"{folder}/ic_launcher_round.png")
    r.save(f"{folder}/ic_launcher_foreground.png")
PYEOF

      - name: Generate Keystore
        env:
          KEYSTORE_BASE64: ""
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Build Android Release
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease

      - name: Upload Artifacts
        uses: actions/artifacts@v4
        with:
          name: focus-champion-builds
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
