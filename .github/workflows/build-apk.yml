name: Build Android APK + AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          npm install
          npm install -g @capacitor/cli
          pip install Pillow

      - name: Prepare WWW folder
        run: |
          mkdir -p www
          [ -f index.html ]    && cp index.html www/    || true
          [ -f manifest.json ] && cp manifest.json www/ || true
          [ -f sw.js ]         && cp sw.js www/         || true
          for f in *.png; do [ -f "$f" ] && cp "$f" www/ || true; done

      - name: Capacitor Sync
        run: |
          if [ ! -d "android" ]; then npx cap add android; fi
          npx cap sync android

      - name: Fix App Name
        run: |
          STRINGS_FILE="android/app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS_FILE" ]; then
            sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Focus Champion<\/string>/g' "$STRINGS_FILE"
            echo "✅ App name fixed to: Focus Champion"
            cat "$STRINGS_FILE"
          else
            echo "⚠️ strings.xml not found, creating..."
            mkdir -p android/app/src/main/res/values
            cat > "$STRINGS_FILE" << 'EOF'
          <?xml version='1.0' encoding='utf-8'?>
          <resources>
              <string name="app_name">Focus Champion</string>
              <string name="title_activity_main">Focus Champion</string>
              <string name="package_name">io.ionic.starter</string>
              <string name="custom_url_scheme">io.ionic.starter</string>
          </resources>
          EOF
          fi

      - name: Add Background Timer Service
        run: |
          JAVA_DIR="android/app/src/main/java/com/focuschampion/app"
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          WEB_DIR="android/app/src/main/assets/public"

          # ==========================================
          # 1. Create TimerForegroundService.java
          # ==========================================
          cat > "$JAVA_DIR/TimerForegroundService.java" << 'JAVAEOF'
package com.focuschampion.app;
import android.app.Notification;
import android.app.NotificationChannel;
import android.app.NotificationManager;
import android.app.PendingIntent;
import android.app.Service;
import android.content.Intent;
import android.media.RingtoneManager;
import android.net.Uri;
import android.os.Build;
import android.os.CountDownTimer;
import android.os.IBinder;
import android.os.VibrationEffect;
import android.os.Vibrator;
import androidx.core.app.NotificationCompat;
public class TimerForegroundService extends Service {
    public static final String CHANNEL_ID    = "FocusTimerChannel";
    public static final String ACTION_START  = "START_TIMER";
    public static final String ACTION_STOP   = "STOP_TIMER";
    public static final String EXTRA_SECONDS = "seconds";
    private CountDownTimer countDownTimer;
    private NotificationManager notifManager;
    @Override public void onCreate() {
        super.onCreate();
        notifManager = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
            NotificationChannel ch = new NotificationChannel(CHANNEL_ID, "Focus Timer", NotificationManager.IMPORTANCE_LOW);
            ch.setDescription("Timer running in background");
            ch.setSound(null, null);
            notifManager.createNotificationChannel(ch);
        }
    }
    @Override public int onStartCommand(Intent intent, int flags, int startId) {
        if (intent == null) return START_NOT_STICKY;
        if (ACTION_START.equals(intent.getAction())) {
            startTimer(intent.getIntExtra(EXTRA_SECONDS, 300));
        } else if (ACTION_STOP.equals(intent.getAction())) {
            stopTimer();
        }
        return START_NOT_STICKY;
    }
    private void startTimer(int totalSec) {
        if (countDownTimer != null) countDownTimer.cancel();
        startForeground(1, buildNotif(totalSec));
        countDownTimer = new CountDownTimer(totalSec * 1000L, 1000) {
            public void onTick(long ms) {
                int s = (int)(ms / 1000);
                notifManager.notify(1, buildNotif(s));
                Intent b = new Intent("TIMER_TICK");
                b.putExtra("seconds", s);
                sendBroadcast(b);
            }
            public void onFinish() {
                playAlarm();
                sendBroadcast(new Intent("TIMER_COMPLETE"));
                notifManager.notify(1, buildDoneNotif());
                stopForeground(false);
                stopSelf();
            }
        }.start();
    }
    private void stopTimer() {
        if (countDownTimer != null) { countDownTimer.cancel(); countDownTimer = null; }
        stopForeground(true);
        stopSelf();
    }
    private Notification buildNotif(int s) {
        String t = String.format("%d:%02d", s/60, s%60);
        Intent i = new Intent(this, MainActivity.class);
        PendingIntent pi = PendingIntent.getActivity(this, 0, i, PendingIntent.FLAG_IMMUTABLE);
        Intent si = new Intent(this, TimerForegroundService.class);
        si.setAction(ACTION_STOP);
        PendingIntent spi = PendingIntent.getService(this, 0, si, PendingIntent.FLAG_IMMUTABLE);
        return new NotificationCompat.Builder(this, CHANNEL_ID)
            .setContentTitle("⏱️ Focus Champion")
            .setContentText(t + " remaining")
            .setSmallIcon(android.R.drawable.ic_dialog_info)
            .setContentIntent(pi)
            .addAction(android.R.drawable.ic_media_pause, "Stop", spi)
            .setOngoing(true).setSilent(true).build();
    }
    private Notification buildDoneNotif() {
        Intent i = new Intent(this, MainActivity.class);
        PendingIntent pi = PendingIntent.getActivity(this, 0, i, PendingIntent.FLAG_IMMUTABLE);
        return new NotificationCompat.Builder(this, CHANNEL_ID)
            .setContentTitle("🎉 Session Complete!")
            .setContentText("Great work! Your focus session is done.")
            .setSmallIcon(android.R.drawable.ic_dialog_info)
            .setContentIntent(pi).setAutoCancel(true).build();
    }
    private void playAlarm() {
        try {
            Uri uri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM);
            if (uri == null) uri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION);
            android.media.Ringtone r = RingtoneManager.getRingtone(this, uri);
            if (r != null) r.play();
        } catch (Exception e) {}
        try {
            Vibrator v = (Vibrator) getSystemService(VIBRATOR_SERVICE);
            if (v != null) {
                long[] p = {0, 500, 200, 500, 200, 500};
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    v.vibrate(VibrationEffect.createWaveform(p, -1));
                } else { v.vibrate(p, -1); }
            }
        } catch (Exception e) {}
    }
    @Override public IBinder onBind(Intent intent) { return null; }
    @Override public void onDestroy() {
        if (countDownTimer != null) countDownTimer.cancel();
        super.onDestroy();
    }
}
JAVAEOF

          # ==========================================
          # 2. Replace MainActivity.java
          # ==========================================
          cat > "$JAVA_DIR/MainActivity.java" << 'JAVAEOF'
package com.focuschampion.app;
import android.content.BroadcastReceiver;
import android.content.Context;
import android.content.Intent;
import android.content.IntentFilter;
import android.os.Build;
import android.os.Bundle;
import android.webkit.JavascriptInterface;
import android.webkit.WebView;
import com.getcapacitor.BridgeActivity;
public class MainActivity extends BridgeActivity {
    private BroadcastReceiver timerReceiver;
    @Override public void onCreate(Bundle savedInstanceState) { super.onCreate(savedInstanceState); }
    @Override protected void onResume() {
        super.onResume();
        try {
            WebView wv = getBridge().getWebView();
            if (wv != null) wv.addJavascriptInterface(new Bridge(), "Android");
        } catch (Exception e) {}
        timerReceiver = new BroadcastReceiver() {
            @Override public void onReceive(Context ctx, Intent intent) {
                String action = intent.getAction();
                if ("TIMER_COMPLETE".equals(action)) {
                    runOnUiThread(() -> evalJS("if(window.androidTimerComplete)androidTimerComplete();"));
                } else if ("TIMER_TICK".equals(action)) {
                    int s = intent.getIntExtra("seconds", 0);
                    runOnUiThread(() -> evalJS("if(window.androidSyncTime)androidSyncTime("+s+");"));
                }
            }
        };
        IntentFilter f = new IntentFilter();
        f.addAction("TIMER_COMPLETE");
        f.addAction("TIMER_TICK");
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
            registerReceiver(timerReceiver, f, Context.RECEIVER_NOT_EXPORTED);
        } else {
            registerReceiver(timerReceiver, f);
        }
    }
    @Override protected void onPause() {
        super.onPause();
        try { if (timerReceiver != null) unregisterReceiver(timerReceiver); } catch (Exception e) {}
    }
    private void evalJS(String js) {
        try { getBridge().getWebView().evaluateJavascript(js, null); } catch (Exception e) {}
    }
    class Bridge {
        @JavascriptInterface public void startTimer(int seconds) {
            Intent i = new Intent(MainActivity.this, TimerForegroundService.class);
            i.setAction("START_TIMER");
            i.putExtra("seconds", seconds);
            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                startForegroundService(i);
            } else { startService(i); }
        }
        @JavascriptInterface public void stopTimer() {
            Intent i = new Intent(MainActivity.this, TimerForegroundService.class);
            i.setAction("STOP_TIMER");
            startService(i);
        }
    }
}
JAVAEOF

          # ==========================================
          # 3. Add permissions + service to AndroidManifest.xml
          # ==========================================
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n</manifest>|' "$MANIFEST"

          sed -i 's|</application>|        <service android:name=".TimerForegroundService" android:foregroundServiceType="specialUse" android:exported="false"/>\n    </application>|' "$MANIFEST"

          echo "✅ AndroidManifest updated!"

          # ==========================================
          # 4. Inject JS bridge into index.html
          # ==========================================
          python3 << 'PYEOF'
import os

bridge = """
<script>
// ===== ANDROID BACKGROUND TIMER BRIDGE =====
(function() {
    window.androidTimerComplete = function() {
        try { if(window.Android) Android.stopTimer(); finishTimer(); } catch(e) {}
    };
    window.androidSyncTime = function(s) {
        try {
            if(typeof isRunning !== 'undefined' && isRunning && typeof timeLeft !== 'undefined') {
                timeLeft = s;
                if(typeof updateDisplay === 'function') updateDisplay();
                if(typeof updateProgress === 'function') updateProgress();
            }
        } catch(e) {}
    };
    function patchFunctions() {
        if (typeof doStartTimer === 'undefined') { setTimeout(patchFunctions, 300); return; }
        var origStart = window.doStartTimer;
        var origReset = window.resetTimer;
        window.doStartTimer = function() {
            origStart.apply(this, arguments);
            try { if(window.Android) Android.startTimer(timeLeft); } catch(e) {}
        };
        window.resetTimer = function() {
            origReset.apply(this, arguments);
            try { if(window.Android) Android.stopTimer(); } catch(e) {}
        };
    }
    document.addEventListener('DOMContentLoaded', function() { setTimeout(patchFunctions, 500); });
})();
</script>
"""

web_dir = "android/app/src/main/assets/public"
html_path = os.path.join(web_dir, "index.html")

if os.path.exists(html_path):
    with open(html_path, 'r', encoding='utf-8') as f:
        content = f.read()
    if 'androidTimerComplete' not in content:
        content = content.replace('</body>', bridge + '\n</body>')
        with open(html_path, 'w', encoding='utf-8') as f:
            f.write(content)
        print("✅ JS bridge injected into index.html!")
    else:
        print("⚠️ Bridge already exists, skipping.")
else:
    print("⚠️ index.html not found at:", html_path)
PYEOF

      - name: Generate App Icons
        run: |
          python3 << 'PYEOF'
          from PIL import Image
          import os
          src = "icon-512.png" if os.path.exists("icon-512.png") else "icon-192.png"
          img = Image.open(src).convert("RGBA")
          sizes = {
              "android/app/src/main/res/mipmap-mdpi": 48,
              "android/app/src/main/res/mipmap-hdpi": 72,
              "android/app/src/main/res/mipmap-xhdpi": 96,
              "android/app/src/main/res/mipmap-xxhdpi": 144,
              "android/app/src/main/res/mipmap-xxxhdpi": 192,
          }
          for folder, size in sizes.items():
              os.makedirs(folder, exist_ok=True)
              resized = img.resize((size, size), Image.LANCZOS)
              resized.save(f"{folder}/ic_launcher.png")
              resized.save(f"{folder}/ic_launcher_round.png")
              resized.save(f"{folder}/ic_launcher_foreground.png")
              print(f"✅ {size}x{size} done")
          PYEOF

      - name: Generate Keystore
        run: |
          keytool -genkeypair \
            -alias focuschampion \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore focuschampion.keystore \
            -storepass "Ali@191349" \
            -keypass "Ali@191349" \
            -dname "CN=aliapps, OU=aliapps, O=aliapps, L=Dubai, ST=Dubai, C=AE" \
            -noprompt
          echo "✅ Keystore generated!"

      - name: Set Version
        run: |
          python3 << 'PYEOF'
          import re

          VERSION_CODE = 1
          VERSION_NAME = "1.0.0"

          gradle = open("android/app/build.gradle").read()
          gradle = re.sub(r'versionCode\s+\d+', f'versionCode {VERSION_CODE}', gradle)
          gradle = re.sub(r'versionName\s+"[^"]+"', f'versionName "{VERSION_NAME}"', gradle)
          open("android/app/build.gradle", "w").write(gradle)
          print(f"✅ versionCode={VERSION_CODE} versionName={VERSION_NAME}")
          PYEOF

      - name: Build Release APK and AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/../focuschampion.keystore \
            -Pandroid.injected.signing.store.password="Ali@191349" \
            -Pandroid.injected.signing.key.alias=focuschampion \
            -Pandroid.injected.signing.key.password="Ali@191349"
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/../focuschampion.keystore \
            -Pandroid.injected.signing.store.password="Ali@191349" \
            -Pandroid.injected.signing.key.alias=focuschampion \
            -Pandroid.injected.signing.key.password="Ali@191349"

      - name: Upload Keystore Backup
        uses: actions/upload-artifact@v4
        with:
          name: KEYSTORE-BACKUP-SAVE-OFFLINE
          path: focuschampion.keystore
          retention-days: 7

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusChampion-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: FocusChampion-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
