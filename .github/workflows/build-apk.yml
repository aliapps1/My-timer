name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          npm install
          npm install -g @capacitor/cli

      - name: Prepare WWW folder
        run: |
          mkdir -p www
          [ -f index.html ] && cp index.html www/ || echo "no index.html"
          [ -f manifest.json ] && cp manifest.json www/ || true
          [ -f sw.js ] && cp sw.js www/ || true
          for f in *.png; do [ -f "$f" ] && cp "$f" www/ || true; done

      - name: Capacitor Sync
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Copy App Icon
        run: |
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          if [ -f "icon-512.png" ]; then
            cp icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
            cp icon-192.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp icon-192.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
            cp icon-192.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp icon-192.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
            cp icon-192.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp icon-192.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
            cp icon-192.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp icon-192.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
            echo "✅ Icons copied!"
          fi

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusChampion-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
