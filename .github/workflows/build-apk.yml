name: Build Android APK + AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          npm install
          npm install -g @capacitor/cli
          pip install Pillow

      - name: Prepare WWW folder
        run: |
          mkdir -p www
          [ -f index.html ]    && cp index.html www/    || true
          [ -f manifest.json ] && cp manifest.json www/ || true
          [ -f sw.js ]         && cp sw.js www/         || true
          for f in *.png; do [ -f "$f" ] && cp "$f" www/ || true; done

      - name: Capacitor Sync
        run: |
          if [ ! -d "android" ]; then npx cap add android; fi
          npx cap sync android

      - name: Fix App Name
        run: |
          STRINGS_FILE="android/app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS_FILE" ]; then
            sed -i 's|<string name="app_name">.*</string>|<string name="app_name">Focus Champion</string>|g' "$STRINGS_FILE"
          fi

      - name: Add Background Timer Service
        run: |
          JAVA_DIR="android/app/src/main/java/com/focuschampion/app"

          # Write TimerForegroundService.java from base64
          echo "" | base64 -d > "$JAVA_DIR/TimerForegroundService.java"
          echo "✅ TimerForegroundService.java created"

          # Write MainActivity.java from base64
          echo "" | base64 -d > "$JAVA_DIR/MainActivity.java"
          echo "✅ MainActivity.java created"

          # Add permissions to AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "FOREGROUND_SERVICE" "$MANIFEST"; then
            sed -i 's|</manifest>|    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n</manifest>|' "$MANIFEST"
          fi
          if ! grep -q "TimerForegroundService" "$MANIFEST"; then
            sed -i 's|</application>|        <service android:name=".TimerForegroundService" android:foregroundServiceType="specialUse" android:exported="false"/>\n    </application>|' "$MANIFEST"
          fi
          echo "✅ AndroidManifest updated"

          # Inject JS bridge into index.html
          HTML="android/app/src/main/assets/public/index.html"
          if [ -f "$HTML" ] && ! grep -q "androidTimerComplete" "$HTML"; then
            BRIDGE='<script>(function(){window.androidTimerComplete=function(){try{if(window.Android)Android.stopTimer();if(typeof finishTimer==="function")finishTimer();}catch(e){}};window.androidSyncTime=function(s){try{if(typeof isRunning!=="undefined"&&isRunning){timeLeft=s;if(typeof updateDisplay==="function")updateDisplay();if(typeof updateProgress==="function")updateProgress();}}catch(e){}};function patch(){if(typeof doStartTimer==="undefined"){setTimeout(patch,300);return;}var oS=window.doStartTimer,oR=window.resetTimer;window.doStartTimer=function(){oS.apply(this,arguments);try{if(window.Android)Android.startTimer(timeLeft);}catch(e){}};window.resetTimer=function(){oR.apply(this,arguments);try{if(window.Android)Android.stopTimer();}catch(e){}};}document.addEventListener("DOMContentLoaded",function(){setTimeout(patch,500);});})();<\/script>'
            sed -i "s|</body>|$BRIDGE\n</body>|" "$HTML"
            echo "✅ JS bridge injected"
          fi

      - name: Generate App Icons
        run: |
          python3 << 'PYEOF'
          from PIL import Image
          import os
          src = "icon-512.png" if os.path.exists("icon-512.png") else "icon-192.png"
          img = Image.open(src).convert("RGBA")
          sizes = {
              "android/app/src/main/res/mipmap-mdpi": 48,
              "android/app/src/main/res/mipmap-hdpi": 72,
              "android/app/src/main/res/mipmap-xhdpi": 96,
              "android/app/src/main/res/mipmap-xxhdpi": 144,
              "android/app/src/main/res/mipmap-xxxhdpi": 192,
          }
          for folder, size in sizes.items():
              os.makedirs(folder, exist_ok=True)
              resized = img.resize((size, size), Image.LANCZOS)
              resized.save(f"{folder}/ic_launcher.png")
              resized.save(f"{folder}/ic_launcher_round.png")
              resized.save(f"{folder}/ic_launcher_foreground.png")
              print(f"✅ {size}x{size} done")
          PYEOF

      - name: Generate Keystore
        run: |
          keytool -genkeypair \
            -alias focuschampion \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore focuschampion.keystore \
            -storepass "Ali@191349" \
            -keypass "Ali@191349" \
            -dname "CN=aliapps, OU=aliapps, O=aliapps, L=Dubai, ST=Dubai, C=AE" \
            -noprompt
          echo "✅ Keystore generated!"

      - name: Set Version
        run: |
          python3 << 'PYEOF'
          import re
          VERSION_CODE = 1
          VERSION_NAME = "1.0.0"
          gradle = open("android/app/build.gradle").read()
          gradle = re.sub(r'versionCode\s+\d+', f'versionCode {VERSION_CODE}', gradle)
          gradle = re.sub(r'versionName\s+"[^"]+"', f'versionName "{VERSION_NAME}"', gradle)
          open("android/app/build.gradle", "w").write(gradle)
          print(f"✅ versionCode={VERSION_CODE} versionName={VERSION_NAME}")
          PYEOF

      - name: Build Release APK and AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/../focuschampion.keystore \
            -Pandroid.injected.signing.store.password="Ali@191349" \
            -Pandroid.injected.signing.key.alias=focuschampion \
            -Pandroid.injected.signing.key.password="Ali@191349"
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/../focuschampion.keystore \
            -Pandroid.injected.signing.store.password="Ali@191349" \
            -Pandroid.injected.signing.key.alias=focuschampion \
            -Pandroid.injected.signing.key.password="Ali@191349"

      - name: Upload Keystore Backup
        uses: actions/upload-artifact@v4
        with:
          name: KEYSTORE-BACKUP-SAVE-OFFLINE
          path: focuschampion.keystore
          retention-days: 7

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusChampion-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: FocusChampion-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
