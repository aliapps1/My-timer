<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Test - Focus Timer Pro</title>
    <style>
        :root { 
            --bg: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); 
            --card: rgba(255, 255, 255, 0.95); 
            --text: #1e293b; 
            --primary: #0284c7; 
            --accent: #f59e0b; 
        }
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
            direction: ltr;
        }
        body.rtl { direction: rtl; font-family: Tahoma, Arial, sans-serif; }
        .card { 
            background: var(--card); 
            backdrop-filter: blur(15px); 
            padding: 2rem; 
            border-radius: 3rem; 
            width: 100%; 
            max-width: 450px; 
            text-align: center; 
            border: 1px solid white; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
        }
        .lang-selector {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .lang-btn {
            padding: 8px 15px;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.2s;
        }
        .lang-btn.active {
            background: var(--primary);
            color: white;
            border: none;
        }
        .time { 
            font-size: 7rem; 
            font-weight: 900; 
            margin: 20px 0; 
            color: var(--primary); 
            font-family: 'Courier New', monospace; 
        }
        .btn { 
            padding: 18px 40px; 
            border-radius: 20px; 
            border: none; 
            font-weight: bold; 
            cursor: pointer; 
            color: white; 
            font-size: 1.2rem; 
            margin: 10px;
            transition: all 0.2s;
        }
        .btn:active { transform: scale(0.95); }
        .btn-start { background: var(--accent); }
        .btn-reset { background: #ef4444; }
        .info {
            background: #fef3c7;
            padding: 18px;
            border-radius: 15px;
            margin: 20px 0;
            border: 2px solid #f59e0b;
            font-size: 0.95em;
        }
        .progress-ring { 
            position: relative; 
            width: 100%; 
            height: 10px; 
            background: #e2e8f0; 
            border-radius: 10px; 
            margin: 15px 0; 
            overflow: hidden;
        }
        .progress-ring-fill { 
            height: 100%; 
            background: linear-gradient(90deg, #0284c7, #0ea5e9); 
            width: 0%; 
            transition: width 0.5s ease;
        }
        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: bold;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="lang-selector">
            <button class="lang-btn active" onclick="changeLang('en')">EN</button>
            <button class="lang-btn" onclick="changeLang('ar')">AR</button>
            <button class="lang-btn" onclick="changeLang('fa')">FA</button>
        </div>

        <h1 style="color: var(--primary); margin: 0;" id="title">⚡ Quick Test</h1>
        <p style="color: #64748b; font-size: 0.9em;" id="subtitle">5-second timer</p>
        
        <div class="info">
            <strong id="info-title">💡 This is a test version</strong><br>
            <span id="info-text">Timer lasts only <strong style="color: #f59e0b;">5 seconds</strong><br>For quick testing of sound, vibration and notifications</span>
        </div>

        <div class="time" id="display">0:05</div>
        
        <div class="progress-ring">
            <div class="progress-ring-fill" id="progressBar"></div>
        </div>

        <div>
            <button class="btn btn-start" id="btnStart" onclick="startTimer()">
                <span id="btn-start-text">Start ▶️</span>
            </button>
            <button class="btn btn-reset" onclick="resetTimer()">
                <span id="btn-reset-text">Reset 🔄</span>
            </button>
        </div>

        <div id="status"></div>
    </div>

    <audio id="backupAudio" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        let timeLeft = 5;
        const duration = 5;
        let timerId = null;
        let isPaused = true;
        let currentLang = 'en';

        const translations = {
            en: {
                title: '⚡ Quick Test',
                subtitle: '5-second timer',
                infoTitle: '💡 This is a test version',
                infoText: 'Timer lasts only <strong style="color: #f59e0b;">5 seconds</strong><br>For quick testing of sound, vibration and notifications',
                btnStart: 'Start ▶️',
                btnReset: 'Reset 🔄',
                btnRunning: 'Running... ⏳',
                statusStart: '⏰ Timer started! Wait 5 seconds...',
                statusComplete: '🎉 Timer complete! Did you hear sound and feel vibration?',
                statusReset: '🔄 Timer reset. Ready to start again!',
                statusReady: '✅ Ready! Press start button',
                statusPermission: '⚠️ Please allow notifications',
                statusInfo: 'ℹ️ For best experience, allow notifications',
                notifTitle: '🎉 Test Timer Complete!',
                notifBody: 'Did you see this notification? Did you hear the sound?',
                notifReminder: '⏰ Test - {{seconds}} seconds passed',
                notifReminderBody: 'Are you seeing the notifications?'
            },
            fa: {
                title: '⚡ تست سریع',
                subtitle: 'تایمر 5 ثانیه‌ای',
                infoTitle: '💡 این نسخه تست است',
                infoText: 'تایمر فقط <strong style="color: #f59e0b;">5 ثانیه</strong> طول می‌کشد<br>برای تست سریع صدا، لرزش و اعلان',
                btnStart: 'شروع ▶️',
                btnReset: 'ریست 🔄',
                btnRunning: 'در حال اجرا... ⏳',
                statusStart: '⏰ تایمر شروع شد! 5 ثانیه صبر کنید...',
                statusComplete: '🎉 تایمر تمام شد! آیا صدا و لرزش را حس کردید؟',
                statusReset: '🔄 تایمر ریست شد. آماده شروع مجدد!',
                statusReady: '✅ آماده! دکمه شروع را بزنید',
                statusPermission: '⚠️ لطفاً دسترسی اعلان را بدهید',
                statusInfo: 'ℹ️ برای بهترین تجربه، دسترسی اعلان بدهید',
                notifTitle: '🎉 تست تایمر تمام شد!',
                notifBody: 'آیا این اعلان را دیدید؟ آیا صدا شنیدید؟',
                notifReminder: '⏰ تست - {{seconds}} ثانیه گذشت',
                notifReminderBody: 'آیا اعلان‌ها را می‌بینید؟'
            },
            ar: {
                title: '⚡ اختبار سريع',
                subtitle: 'مؤقت 5 ثواني',
                infoTitle: '💡 هذا إصدار تجريبي',
                infoText: 'المؤقت يستمر فقط <strong style="color: #f59e0b;">5 ثوانٍ</strong><br>لاختبار سريع للصوت والاهتزاز والإشعارات',
                btnStart: 'بدء ▶️',
                btnReset: 'إعادة ضبط 🔄',
                btnRunning: 'جاري التشغيل... ⏳',
                statusStart: '⏰ بدأ المؤقت! انتظر 5 ثوانٍ...',
                statusComplete: '🎉 اكتمل المؤقت! هل سمعت الصوت وشعرت بالاهتزاز؟',
                statusReset: '🔄 تمت إعادة ضبط المؤقت. جاهز للبدء مرة أخرى!',
                statusReady: '✅ جاهز! اضغط على زر البدء',
                statusPermission: '⚠️ يرجى السماح بالإشعارات',
                statusInfo: 'ℹ️ للحصول على أفضل تجربة، اسمح بالإشعارات',
                notifTitle: '🎉 اكتمل اختبار المؤقت!',
                notifBody: 'هل رأيت هذا الإشعار؟ هل سمعت الصوت؟',
                notifReminder: '⏰ اختبار - مرت {{seconds}} ثانية',
                notifReminderBody: 'هل ترى الإشعارات؟'
            }
        };

        function changeLang(lang) {
            currentLang = lang;
            const isRTL = lang === 'fa' || lang === 'ar';
            document.body.className = isRTL ? 'rtl' : '';
            document.documentElement.dir = isRTL ? 'rtl' : 'ltr';
            
            // Update lang buttons
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            updateUI();
        }

        function updateUI() {
            const t = translations[currentLang];
            document.getElementById('title').textContent = t.title;
            document.getElementById('subtitle').textContent = t.subtitle;
            document.getElementById('info-title').textContent = t.infoTitle;
            document.getElementById('info-text').innerHTML = t.infoText;
            document.getElementById('btn-start-text').textContent = isPaused ? t.btnStart : t.btnRunning;
            document.getElementById('btn-reset-text').textContent = t.btnReset;
        }

        // Create loud alarm sound using Web Audio API
        function createLoudAlarmSound() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const now = audioContext.currentTime;
                
                playLoudTone(audioContext, 800, now, 0.4, 0.8);
                playLoudTone(audioContext, 1000, now + 0.15, 0.4, 0.8);
                playLoudTone(audioContext, 1200, now + 0.3, 0.4, 0.8);
                
            } catch (err) {
                console.log('Web Audio API error:', err);
            }
        }

        function playLoudTone(audioContext, frequency, startTime, duration, volume) {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = frequency;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0, startTime);
            gainNode.gain.linearRampToValueAtTime(volume, startTime + 0.02);
            gainNode.gain.linearRampToValueAtTime(0, startTime + duration);
            
            oscillator.start(startTime);
            oscillator.stop(startTime + duration);
        }

        function updateDisplay() {
            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            document.getElementById('display').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
            
            const progress = ((duration - timeLeft) / duration) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
        }

        async function startTimer() {
            if (!isPaused) return;
            
            const t = translations[currentLang];
            
            if ('Notification' in window && Notification.permission === 'default') {
                await Notification.requestPermission();
            }
            
            isPaused = false;
            document.getElementById('btn-start-text').textContent = t.btnRunning;
            document.getElementById('btnStart').disabled = true;
            showStatus(t.statusStart, '#0284c7', '#f0f9ff');
            
            timerId = setInterval(() => {
                timeLeft--;
                updateDisplay();
                
                if (timeLeft <= 0) {
                    finishTimer();
                }
            }, 1000);
        }

        function finishTimer() {
            clearInterval(timerId);
            isPaused = true;
            const t = translations[currentLang];
            
            document.getElementById('btn-start-text').textContent = t.btnStart;
            document.getElementById('btnStart').disabled = false;
            
            showStatus(t.statusComplete, '#10b981', '#dcfce7');
            
            // NOTIFICATION
            if ('Notification' in window && Notification.permission === 'granted') {
                const notification = new Notification(t.notifTitle, {
                    body: t.notifBody,
                    icon: 'icon-192.png',
                    badge: 'icon-72.png',
                    tag: 'focus-test',
                    requireInteraction: true,
                    vibrate: [400, 200, 400, 200, 400],
                    timestamp: Date.now()
                });
                
                notification.onclick = () => {
                    window.focus();
                    notification.close();
                };
            }
            
            // AUDIO
            const audio = document.getElementById('backupAudio');
            audio.loop = true;
            audio.volume = 1.0;
            audio.play().catch(err => {
                console.log('Audio blocked:', err);
            });
            
            // WEB AUDIO
            createLoudAlarmSound();
            
            // VIBRATION
            if ('vibrate' in navigator) {
                navigator.vibrate([400, 200, 400, 200, 400, 200, 400]);
            }
            
            // REPEAT
            let count = 0;
            const interval = setInterval(() => {
                count++;
                createLoudAlarmSound();
                
                if ('vibrate' in navigator) {
                    navigator.vibrate([400, 200, 400]);
                }
                
                if (count % 2 === 0 && 'Notification' in window && Notification.permission === 'granted') {
                    const reminderText = t.notifReminder.replace('{{seconds}}', count * 2);
                    new Notification(reminderText, {
                        body: t.notifReminderBody,
                        icon: 'icon-192.png',
                        tag: 'focus-reminder-' + count,
                        requireInteraction: true,
                        vibrate: [200, 100, 200]
                    });
                }
                
                if (count >= 5) {
                    clearInterval(interval);
                    audio.pause();
                    audio.loop = false;
                    audio.currentTime = 0;
                }
            }, 2000);
        }

        function resetTimer() {
            clearInterval(timerId);
            isPaused = true;
            timeLeft = duration;
            updateDisplay();
            const t = translations[currentLang];
            document.getElementById('btn-start-text').textContent = t.btnStart;
            document.getElementById('btnStart').disabled = false;
            showStatus(t.statusReset, '#64748b', '#f1f5f9');
        }

        function showStatus(message, color, bgColor) {
            const status = document.getElementById('status');
            status.innerText = message;
            status.style.color = color;
            status.style.background = bgColor || 'transparent';
        }

        // Initialize
        updateDisplay();
        updateUI();
        
        window.addEventListener('load', async () => {
            const t = translations[currentLang];
            if ('Notification' in window && Notification.permission === 'default') {
                const permission = await Notification.requestPermission();
                if (permission === 'granted') {
                    showStatus(t.statusReady, '#10b981', '#dcfce7');
                } else {
                    showStatus(t.statusPermission, '#f59e0b', '#fef3c7');
                }
            } else if ('Notification' in window && Notification.permission === 'granted') {
                showStatus(t.statusReady, '#10b981', '#dcfce7');
            } else {
                showStatus(t.statusInfo, '#0284c7', '#f0f9ff');
            }
        });
    </script>
</body>
</html>

        }

            document.getElementById('display').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;

            if ('Notification' in window && Notification.permission === 'default') {

            document.getElementById('btnStart').innerText = 'شروع ▶️';
            document.getElementById('btnStart').disabled = false;
            showStatus('🔄 تایمر ریست شد. آماده شروع مجدد!', '#64748b', '#f1f5f9');
        }

        function showStatus(message, color, bgColor) {
            const status = document.getElementById('status');
            status.innerText = message;
            status.style.color = color;
            status.style.background = bgColor || 'transparent';
        }

        // Initialize
        updateDisplay();
        
        // Request notification permission on load
        window.addEventListener('load', async () => {
            if ('Notification' in window && Notification.permission === 'default') {
                const permission = await Notification.requestPermission();
                if (permission === 'granted') {
                    showStatus('✅ آماده! دکمه شروع را بزنید', '#10b981', '#dcfce7');
                } else {
                    showStatus('⚠️ لطفاً دسترسی اعلان را بدهید', '#f59e0b', '#fef3c7');
                }
            } else if ('Notification' in window && Notification.permission === 'granted') {
                showStatus('✅ آماده! دکمه شروع را بزنید', '#10b981', '#dcfce7');
            } else {
                showStatus('ℹ️ برای بهترین تجربه، دسترسی اعلان بدهید', '#0284c7', '#f0f9ff');
            }
        });
    </script>
</body>
</html>
